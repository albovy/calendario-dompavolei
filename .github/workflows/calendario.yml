# Genera el calendario de Dompavolei y lo publica en GitHub Pages.
# Este archivo va en el repositorio como: .github/workflows/calendario.yml
# Versión en JavaScript (src/main.js, Node.js): sustituye a calendario-voley.ps1.
#
# Lo lanza cada hora cron-job.org (llamando a workflow_dispatch; la programación de GitHub llegaba con mucho
# retraso), el botón «Run workflow» y cada cambio que se sube.
#
# Va en macOS: el servidor de la federación (51.178.170.113) descarta en silencio las conexiones de parte de
# las máquinas Linux de GitHub, que están en Azure (~40 % de las ejecuciones fallaban; el diagnóstico del
# 28/09/2026 lo confirmó: esas máquinas llegan a otros servidores, incluso de iSquad, pero no a ese). Las macOS
# salen por direcciones propias de GitHub y llegaban todas. Si alguna no llega, no se hace nada (sin error y
# con un aviso) y lo vuelve a intentar la ejecución de la hora siguiente.

name: Calendario Dompavolei

on:
  workflow_dispatch:              # cron-job.org cada hora, y el botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths-ignore: ['historial/**']

permissions:
  contents: write                 # para guardar el historial de cambios
  pages: write
  id-token: write

# Una a la vez; la nueva cancela a la que siga en marcha: una ejecución atascada (el 26/09/2026 una se
# quedó 10 horas esperando máquina) no bloquea las de las horas siguientes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: macos-latest
    timeout-minutes: 15           # normalmente 1-2 min
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7

      # ¿Llega esta máquina a la federación? (8 s). Si no, no se hace nada más: no es un fallo nuestro, así
      # que la ejecución acaba bien, con un aviso; la de la hora siguiente irá en otra máquina.
      - name: ¿Llega a la federación?
        id: sonda
        run: |
          t=$(curl -s -o /dev/null --connect-timeout 8 -m 20 -w '%{time_connect}' https://resultadosvoleibol.isquad.es/ || true)
          if [ -n "$t" ] && [ "$t" != "0.000000" ]; then
            echo "Conecta con la federación en $t s."
            echo "llega=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::La federación no deja conectar a esta máquina de GitHub; se deja para la próxima ejecución."
            echo "llega=false" >> "$GITHUB_OUTPUT"
          fi

      - id: pages
        if: steps.sonda.outputs.llega == 'true'
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        if: steps.sonda.outputs.llega == 'true'
        with:
          node-version: 24

      # src/main.js no tiene dependencias: no hace falta npm install.
      - name: Generar calendario
        if: steps.sonda.outputs.llega == 'true'
        run: node src/main.js --salida web --nombre-base calendario --historial historial/partidos.txt

      # Si la federación devolviera 0 partidos por un fallo, no se borra el calendario de los suscritos.
      - name: Comprobar que no se publica un calendario vacío
        if: steps.sonda.outputs.llega == 'true'
        run: |
          nuevo=$(grep -c '^BEGIN:VEVENT' web/calendario.ics || true)
          antes=$(curl -fsS "${{ steps.pages.outputs.base_url }}/calendario.ics" 2>/dev/null | grep -c '^BEGIN:VEVENT' || true)
          echo "Partidos ahora: ${nuevo:-0} · publicados: ${antes:-0}"
          if [ "${nuevo:-0}" -eq 0 ] && [ "${antes:-0}" -gt 0 ]; then
            echo "::error::La federación ha devuelto 0 partidos del club y la web tiene ${antes}. No se publica."
            exit 1
          fi

      # La página es la de inicio (calendario.html también vale). salidas.html, donde se probó el diseño
      # nuevo en septiembre de 2026, solo lleva a ella, para que no se rompan los enlaces guardados.
      - name: Página de inicio
        if: steps.sonda.outputs.llega == 'true'
        run: |
          cp web/calendario.html web/index.html
          cat > web/salidas.html <<'FIN'
          <!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=./">
          <link rel="canonical" href="./">
          <title>Calendario de partidos</title>
          <script>location.replace('./');</script>
          </head><body><p><a href="./">El calendario está en la página de inicio.</a></p></body></html>
          FIN

      - uses: actions/upload-pages-artifact@v5
        if: steps.sonda.outputs.llega == 'true'
        with:
          path: web

      - id: despliegue
        if: steps.sonda.outputs.llega == 'true'
        uses: actions/deploy-pages@v5

      # Guarda la lista de partidos (y los tiempos de viaje, la copia de la temporada anterior y los
      # resultados) solo cuando cambian: deja un historial de cambios y las cachés para la próxima vez.
      - name: Guardar historial de cambios
        if: steps.sonda.outputs.llega == 'true'
        continue-on-error: true
        run: |
          git add historial/partidos.txt
          [ -f pabellones.json ] && git add pabellones.json
          [ -f temporada-anterior.json ] && git add temporada-anterior.json
          [ -f resultados.json ] && git add resultados.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Cambios en el calendario de la federación'
            git push
          fi
