# Genera el calendario de Dompavolei cada hora y lo publica en GitHub Pages.
# Este archivo va en el repositorio como: .github/workflows/calendario.yml
# Versión en JavaScript (src/main.js, Node.js): sustituye a calendario-voley.ps1.

name: Calendario Dompavolei

on:
  schedule:
    # Cada hora en punto y 17 (hora UTC, la zona de siempre de GitHub): de 8:17 a 0:17 en horario de
    # verano y de 7:17 a 23:17 en invierno, hora de Galicia. Sin "timezone:", que es más reciente y
    # daba problemas para programar las ejecuciones.
    - cron: '17 6-22 * * *'
  workflow_dispatch:              # botón "Run workflow" para actualizar a mano
    inputs:
      intento:
        description: 'Relanzamiento automático tras no poder conectar con la federación (0 = normal)'
        required: false
        default: '0'
  push:
    branches: [main]
    paths-ignore: ['historial/**']

permissions:
  contents: write                 # para guardar el historial de cambios
  pages: write
  id-token: write
  actions: write                  # para relanzar la publicación en otra máquina (paso del final)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # src/main.js no tiene dependencias: no hace falta npm install. La salida se guarda en generar.log
      # para saber, si falla, si fue porque la federación no dejó conectar (ver el último paso).
      - name: Generar calendario
        id: generar
        run: set -o pipefail; node src/main.js --salida web --nombre-base calendario --historial historial/partidos.txt 2>&1 | tee generar.log

      # Si la federación devolviera 0 partidos por un fallo, no se borra el calendario de los suscritos.
      - name: Comprobar que no se publica un calendario vacío
        run: |
          nuevo=$(grep -c '^BEGIN:VEVENT' web/calendario.ics || true)
          antes=$(curl -fsS "${{ steps.pages.outputs.base_url }}/calendario.ics" 2>/dev/null | grep -c '^BEGIN:VEVENT' || true)
          echo "Partidos ahora: ${nuevo:-0} · publicados: ${antes:-0}"
          if [ "${nuevo:-0}" -eq 0 ] && [ "${antes:-0}" -gt 0 ]; then
            echo "::error::La federación ha devuelto 0 partidos del club y la web tiene ${antes}. No se publica."
            exit 1
          fi

      # La página es la de inicio (calendario.html también vale). salidas.html, donde se probó el diseño
      # nuevo en septiembre de 2026, solo lleva a ella, para que no se rompan los enlaces guardados.
      - name: Página de inicio
        run: |
          cp web/calendario.html web/index.html
          cat > web/salidas.html <<'FIN'
          <!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=./">
          <link rel="canonical" href="./">
          <title>Calendario de partidos</title>
          <script>location.replace('./');</script>
          </head><body><p><a href="./">El calendario está en la página de inicio.</a></p></body></html>
          FIN

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: despliegue
        uses: actions/deploy-pages@v5

      # Guarda la lista de partidos (y los tiempos de viaje, la copia de la temporada anterior y los
      # resultados) solo cuando cambian. Deja un historial de cambios y mantiene el repositorio activo
      # (GitHub pausa las tareas programadas tras 60 días sin commits).
      - name: Guardar historial de cambios
        continue-on-error: true
        run: |
          git add historial/partidos.txt
          [ -f pabellones.json ] && git add pabellones.json
          [ -f temporada-anterior.json ] && git add temporada-anterior.json
          [ -f resultados.json ] && git add resultados.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Cambios en el calendario de la federación'
            git push
          fi

      # La web de la federación no deja conectar a algunas máquinas de GitHub (con otra suele ir bien).
      # Si la generación falló por eso, se lanza otra ejecución, que va a otra máquina: como mucho 3
      # seguidas; si no, se deja para la próxima hora. Otro tipo de fallo no se relanza.
      - name: Relanzar en otra máquina si la federación no dejó conectar
        if: failure() && steps.generar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          INTENTO: ${{ inputs.intento || '0' }}
        run: |
          if ! grep -q 'No se pudo descargar https://resultadosvoleibol.isquad.es' generar.log; then
            echo "El fallo no es de conexión con la federación: no se relanza."
            exit 0
          fi
          if [ "$INTENTO" -ge 3 ]; then
            echo "::warning::Ya van $INTENTO relanzamientos seguidos; se deja para la próxima hora."
            exit 0
          fi
          siguiente=$((INTENTO + 1))
          echo "La federación no ha dejado conectar a esta máquina; se relanza en otra ($siguiente de 3)."
          gh workflow run calendario.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f intento="$siguiente"
